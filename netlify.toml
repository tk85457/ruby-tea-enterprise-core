[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "upgrade-insecure-requests; block-all-mixed-content"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[redirects]]
  from = "/dashboard/*"
  to = "/login"
  status = 302
  force = false

[context.production.environment]
  SECRETS_SCAN_OMIT_PATHS = ".next/**, public/images/**"
  SECRETS_SCAN_OMIT_KEYS = "AUTH_SECRET,RAZORPAY_KEY_SECRET,CLOUDINARY_API_SECRET,NEXT_PUBLIC_ADMIN_SECRET,PUSHER_SECRET,MONGODB_URI"
  environment = { NODE_VERSION = "20", NEXT_USE_NETLIFY_EDGE = "true" }
